<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7aa2f7"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#51cf66"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="#1a1b26" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0caf5">
    Transport Matrix — Theory and Computation
  </text>

  <!-- ============ Step 1: Acquisition ============ -->
  <rect x="30" y="55" width="840" height="150" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
  <text x="60" y="80" font-size="15" font-weight="bold" fill="#7aa2f7">Step 1: Light Transport Acquisition</text>

  <!-- Pattern matrix P -->
  <rect x="50" y="95" width="80" height="80" rx="4" fill="#1a1b26" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="90" y="115" text-anchor="middle" font-size="24" font-weight="bold" fill="#4a9eff">P</text>
  <text x="90" y="135" text-anchor="middle" font-size="9" fill="#565f89">Patterns</text>
  <text x="90" y="148" text-anchor="middle" font-size="9" fill="#565f89">(pq × N)</text>

  <!-- Grid inside P -->
  <line x1="60" y1="155" x2="120" y2="155" stroke="#565f89" stroke-width="0.5"/>
  <line x1="60" y1="160" x2="120" y2="160" stroke="#565f89" stroke-width="0.5"/>
  <line x1="60" y1="165" x2="120" y2="165" stroke="#565f89" stroke-width="0.5"/>

  <!-- Arrow -->
  <line x1="135" y1="135" x2="175" y2="135" stroke="#7aa2f7" stroke-width="2" marker-end="url(#a1)"/>
  <text x="155" y="128" text-anchor="middle" font-size="10" fill="#565f89">project</text>

  <!-- Scene box -->
  <rect x="180" y="95" width="120" height="80" rx="6" fill="#1a1b26" stroke="#565f89" stroke-width="1.5"/>
  <text x="240" y="125" text-anchor="middle" font-size="12" fill="#c0caf5">3D Scene</text>
  <!-- Small objects -->
  <rect x="200" y="135" width="15" height="15" fill="#7aa2f7" opacity="0.4" rx="2"/>
  <circle cx="250" cy="148" r="10" fill="#bb9af7" opacity="0.4"/>

  <!-- Arrow -->
  <line x1="305" y1="135" x2="345" y2="135" stroke="#ff6b6b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="325" y="128" text-anchor="middle" font-size="10" fill="#565f89">capture</text>

  <!-- Capture matrix C -->
  <rect x="350" y="95" width="80" height="80" rx="4" fill="#1a1b26" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="390" y="115" text-anchor="middle" font-size="24" font-weight="bold" fill="#ff6b6b">C</text>
  <text x="390" y="135" text-anchor="middle" font-size="9" fill="#565f89">Captures</text>
  <text x="390" y="148" text-anchor="middle" font-size="9" fill="#565f89">(mn × N)</text>

  <!-- Arrow to computation -->
  <line x1="435" y1="135" x2="485" y2="135" stroke="#bb9af7" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Computation -->
  <rect x="490" y="90" width="340" height="90" rx="8" fill="#1a1b26" stroke="#bb9af7" stroke-width="2"/>
  <text x="660" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#bb9af7">Compute Transport Matrix</text>
  <text x="660" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0caf5">T = C · pinv(P)</text>
  <text x="660" y="165" text-anchor="middle" font-size="11" fill="#565f89">T ∈ ℝ^(mn × pq) — maps projector pixels to camera pixels</text>

  <!-- ============ Step 2: What T contains ============ -->
  <rect x="30" y="215" width="410" height="180" rx="10" fill="#24283b" stroke="#e0af68" stroke-width="2"/>
  <text x="60" y="240" font-size="15" font-weight="bold" fill="#e0af68">Step 2: What T[i,j] Encodes</text>

  <!-- Matrix visualization -->
  <rect x="50" y="255" width="120" height="120" rx="4" fill="#1a1b26" stroke="#e0af68" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="50" y1="285" x2="170" y2="285" stroke="#565f89" stroke-width="0.3"/>
  <line x1="50" y1="315" x2="170" y2="315" stroke="#565f89" stroke-width="0.3"/>
  <line x1="50" y1="345" x2="170" y2="345" stroke="#565f89" stroke-width="0.3"/>
  <line x1="80" y1="255" x2="80" y2="375" stroke="#565f89" stroke-width="0.3"/>
  <line x1="110" y1="255" x2="110" y2="375" stroke="#565f89" stroke-width="0.3"/>
  <line x1="140" y1="255" x2="140" y2="375" stroke="#565f89" stroke-width="0.3"/>
  <!-- Highlight one cell -->
  <rect x="110" y="285" width="30" height="30" fill="#e0af68" opacity="0.3"/>
  <text x="125" y="305" text-anchor="middle" font-size="10" font-weight="bold" fill="#e0af68">T[i,j]</text>
  <!-- Labels -->
  <text x="110" y="250" text-anchor="middle" font-size="9" fill="#7aa2f7">projector pixel j →</text>
  <text x="35" y="310" text-anchor="middle" font-size="9" fill="#ff6b6b" transform="rotate(-90, 35, 310)">camera pixel i →</text>

  <!-- Explanation -->
  <text x="190" y="270" font-size="11" fill="#c0caf5">T[i,j] = fraction of light from</text>
  <text x="190" y="286" font-size="11" fill="#c0caf5">projector pixel j that reaches</text>
  <text x="190" y="302" font-size="11" fill="#c0caf5">camera pixel i, through ALL</text>
  <text x="190" y="318" font-size="11" fill="#c0caf5">transport paths:</text>
  <text x="200" y="340" font-size="10" fill="#7aa2f7">• Direct illumination</text>
  <text x="200" y="355" font-size="10" fill="#bb9af7">• Reflections / bounces</text>
  <text x="200" y="370" font-size="10" fill="#51cf66">• Shadows / occlusion</text>
  <text x="200" y="385" font-size="10" fill="#e0af68">• Scattering / caustics</text>

  <!-- ============ Step 3: SVD ============ -->
  <rect x="460" y="215" width="410" height="180" rx="10" fill="#24283b" stroke="#51cf66" stroke-width="2"/>
  <text x="490" y="240" font-size="15" font-weight="bold" fill="#51cf66">Step 3: SVD Decomposition</text>

  <text x="665" y="270" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0caf5">T = U · Σ · V&#x1D40;</text>

  <!-- Matrix blocks -->
  <rect x="510" y="285" width="40" height="60" rx="3" fill="#7aa2f7" opacity="0.2" stroke="#7aa2f7" stroke-width="1"/>
  <text x="530" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#7aa2f7">U</text>
  <text x="530" y="355" text-anchor="middle" font-size="9" fill="#565f89">mn × k</text>

  <text x="565" y="320" text-anchor="middle" font-size="16" fill="#565f89">·</text>

  <rect x="580" y="290" width="40" height="50" rx="3" fill="#e0af68" opacity="0.2" stroke="#e0af68" stroke-width="1"/>
  <text x="600" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#e0af68">Σ</text>
  <text x="600" y="355" text-anchor="middle" font-size="9" fill="#565f89">k × k</text>

  <text x="635" y="320" text-anchor="middle" font-size="16" fill="#565f89">·</text>

  <rect x="650" y="295" width="60" height="40" rx="3" fill="#bb9af7" opacity="0.2" stroke="#bb9af7" stroke-width="1"/>
  <text x="680" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#bb9af7">V&#x1D40;</text>
  <text x="680" y="355" text-anchor="middle" font-size="9" fill="#565f89">k × pq</text>

  <text x="665" y="380" text-anchor="middle" font-size="10" fill="#a9b1d6">Truncating to rank k acts as</text>
  <text x="665" y="395" text-anchor="middle" font-size="10" fill="#a9b1d6">denoising + compression (Eckart-Young)</text>

  <!-- ============ Step 4: Applications ============ -->
  <rect x="30" y="410" width="840" height="110" rx="10" fill="#24283b" stroke="#f7768e" stroke-width="2"/>
  <text x="60" y="435" font-size="15" font-weight="bold" fill="#f7768e">Step 4: Applications</text>

  <!-- Dual Photography -->
  <rect x="50" y="445" width="230" height="60" rx="6" fill="#1a1b26" stroke="#51cf66" stroke-width="1.5"/>
  <text x="165" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#51cf66">Dual Photography</text>
  <text x="165" y="483" text-anchor="middle" font-size="14" fill="#c0caf5">p_dual = T&#x1D40; · c</text>
  <text x="165" y="498" text-anchor="middle" font-size="9" fill="#565f89">View from projector position</text>

  <!-- Relighting -->
  <rect x="310" y="445" width="230" height="60" rx="6" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="425" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#7aa2f7">Scene Relighting</text>
  <text x="425" y="483" text-anchor="middle" font-size="14" fill="#c0caf5">c_new = T · p_new</text>
  <text x="425" y="498" text-anchor="middle" font-size="9" fill="#565f89">New illumination, no re-capture</text>

  <!-- Low-rank approx -->
  <rect x="570" y="445" width="280" height="60" rx="6" fill="#1a1b26" stroke="#e0af68" stroke-width="1.5"/>
  <text x="710" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#e0af68">Compressed Sensing</text>
  <text x="710" y="483" text-anchor="middle" font-size="14" fill="#c0caf5">N ≪ pq patterns needed</text>
  <text x="710" y="498" text-anchor="middle" font-size="9" fill="#565f89">Bernoulli random + L1 minimization</text>

  <!-- ============ Helmholtz box ============ -->
  <rect x="100" y="535" width="700" height="55" rx="8" fill="#1a1b26" stroke="#bb9af7" stroke-width="2"/>
  <text x="450" y="558" text-anchor="middle" font-size="14" font-weight="bold" fill="#bb9af7">Helmholtz Reciprocity Principle</text>
  <text x="450" y="578" text-anchor="middle" font-size="12" fill="#a9b1d6">
    f_r(ω_i, ω_o) = f_r(ω_o, ω_i)  →  Light paths are physically reversible  →  T&#x1D40; swaps source ↔ observer
  </text>

  <!-- ============ Physical basis ============ -->
  <rect x="200" y="600" width="500" height="35" rx="6" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
  <text x="450" y="622" text-anchor="middle" font-size="11" fill="#565f89">
    Based on: Green's function symmetry G(r_A, r_O) = G(r_O, r_A) from wave optics
  </text>
</svg>
