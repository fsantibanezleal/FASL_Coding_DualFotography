<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="eq" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#565f89"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0caf5">
    SVD Decomposition of the Transport Matrix
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="13" fill="#565f89">
    T = U * Sigma * V^T
  </text>

  <!-- ===== T matrix (large rectangle) ===== -->
  <rect x="30" y="80" width="120" height="160" rx="4" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
  <text x="90" y="150" text-anchor="middle" font-size="28" font-weight="bold" fill="#7aa2f7">T</text>
  <text x="90" y="170" text-anchor="middle" font-size="10" fill="#565f89">mn x pq</text>
  <text x="90" y="260" text-anchor="middle" font-size="10" fill="#a9b1d6">Transport</text>
  <text x="90" y="275" text-anchor="middle" font-size="10" fill="#a9b1d6">Matrix</text>

  <!-- Equals sign -->
  <text x="170" y="165" text-anchor="middle" font-size="28" font-weight="bold" fill="#c0caf5">=</text>

  <!-- ===== U matrix (tall, camera basis) ===== -->
  <rect x="195" y="80" width="80" height="160" rx="4" fill="#24283b" stroke="#51cf66" stroke-width="2"/>
  <text x="235" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#51cf66">U</text>
  <text x="235" y="170" text-anchor="middle" font-size="10" fill="#565f89">mn x r</text>
  <text x="235" y="260" text-anchor="middle" font-size="10" fill="#51cf66">Camera</text>
  <text x="235" y="275" text-anchor="middle" font-size="10" fill="#51cf66">Basis</text>

  <!-- Multiply sign -->
  <text x="290" y="165" text-anchor="middle" font-size="22" fill="#c0caf5">*</text>

  <!-- ===== Sigma matrix (diagonal, square) ===== -->
  <rect x="305" y="100" width="100" height="100" rx="4" fill="#24283b" stroke="#e0af68" stroke-width="2"/>
  <!-- Diagonal elements -->
  <text x="318" y="125" font-size="12" fill="#e0af68">sigma_1</text>
  <text x="340" y="147" font-size="11" fill="#e0af68">sigma_2</text>
  <text x="360" y="169" font-size="10" fill="#e0af68">sigma_3</text>
  <text x="378" y="190" font-size="9" fill="#565f89">...</text>
  <!-- Zero regions -->
  <text x="370" y="125" font-size="10" fill="#30363d">0</text>
  <text x="318" y="170" font-size="10" fill="#30363d">0</text>
  <text x="355" y="260" text-anchor="middle" font-size="10" fill="#e0af68">Singular</text>
  <text x="355" y="275" text-anchor="middle" font-size="10" fill="#e0af68">Values</text>

  <!-- Multiply sign -->
  <text x="420" y="155" text-anchor="middle" font-size="22" fill="#c0caf5">*</text>

  <!-- ===== V^T matrix (wide, projector basis) ===== -->
  <rect x="435" y="105" width="160" height="90" rx="4" fill="#24283b" stroke="#bb9af7" stroke-width="2"/>
  <text x="515" y="148" text-anchor="middle" font-size="24" font-weight="bold" fill="#bb9af7">V^T</text>
  <text x="515" y="170" text-anchor="middle" font-size="10" fill="#565f89">r x pq</text>
  <text x="515" y="260" text-anchor="middle" font-size="10" fill="#bb9af7">Projector</text>
  <text x="515" y="275" text-anchor="middle" font-size="10" fill="#bb9af7">Basis</text>

  <!-- ===== Singular Value Bars ===== -->
  <text x="680" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#e0af68">Singular Values</text>

  <!-- Bar chart -->
  <rect x="645" y="100" width="30" height="130" rx="3" fill="#e0af68" opacity="0.9"/>
  <text x="660" y="245" text-anchor="middle" font-size="10" fill="#e0af68">sigma_1</text>
  <rect x="680" y="145" width="30" height="85" rx="3" fill="#e0af68" opacity="0.7"/>
  <text x="695" y="245" text-anchor="middle" font-size="10" fill="#e0af68">sigma_2</text>
  <rect x="715" y="185" width="30" height="45" rx="3" fill="#e0af68" opacity="0.5"/>
  <text x="730" y="245" text-anchor="middle" font-size="10" fill="#e0af68">sigma_3</text>
  <rect x="750" y="210" width="30" height="20" rx="3" fill="#e0af68" opacity="0.3"/>
  <text x="765" y="245" text-anchor="middle" font-size="9" fill="#565f89">...</text>

  <!-- Baseline for bars -->
  <line x1="640" y1="230" x2="785" y2="230" stroke="#565f89" stroke-width="1"/>

  <!-- ===== Basis Images (U columns) ===== -->
  <text x="150" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#51cf66">Camera Eigenimages (U columns)</text>

  <!-- u_1 thumbnail -->
  <rect x="40" y="330" width="55" height="55" rx="3" fill="#1a1b26" stroke="#51cf66" stroke-width="1.5"/>
  <rect x="48" y="338" width="18" height="12" fill="#51cf66" opacity="0.8"/>
  <rect x="48" y="355" width="12" height="18" fill="#51cf66" opacity="0.5"/>
  <rect x="65" y="350" width="15" height="10" fill="#51cf66" opacity="0.3"/>
  <text x="67" y="400" text-anchor="middle" font-size="10" fill="#a9b1d6">u_1</text>

  <!-- u_2 thumbnail -->
  <rect x="110" y="330" width="55" height="55" rx="3" fill="#1a1b26" stroke="#51cf66" stroke-width="1.5"/>
  <rect x="120" y="345" width="35" height="8" fill="#51cf66" opacity="0.6"/>
  <rect x="125" y="358" width="25" height="8" fill="#51cf66" opacity="0.4"/>
  <text x="137" y="400" text-anchor="middle" font-size="10" fill="#a9b1d6">u_2</text>

  <!-- u_3 thumbnail -->
  <rect x="180" y="330" width="55" height="55" rx="3" fill="#1a1b26" stroke="#51cf66" stroke-width="1.5"/>
  <rect x="195" y="340" width="10" height="30" fill="#51cf66" opacity="0.4"/>
  <rect x="210" y="350" width="10" height="20" fill="#51cf66" opacity="0.3"/>
  <text x="207" y="400" text-anchor="middle" font-size="10" fill="#a9b1d6">u_3</text>

  <!-- ===== Basis Patterns (V columns) ===== -->
  <text x="520" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#bb9af7">Projector Basis Patterns (V columns)</text>

  <!-- v_1 thumbnail -->
  <rect x="420" y="330" width="55" height="55" rx="3" fill="#1a1b26" stroke="#bb9af7" stroke-width="1.5"/>
  <rect x="428" y="338" width="20" height="20" fill="#bb9af7" opacity="0.8"/>
  <rect x="450" y="345" width="15" height="15" fill="#bb9af7" opacity="0.4"/>
  <text x="447" y="400" text-anchor="middle" font-size="10" fill="#a9b1d6">v_1</text>

  <!-- v_2 thumbnail -->
  <rect x="490" y="330" width="55" height="55" rx="3" fill="#1a1b26" stroke="#bb9af7" stroke-width="1.5"/>
  <rect x="498" y="355" width="38" height="6" fill="#bb9af7" opacity="0.6"/>
  <rect x="505" y="340" width="25" height="6" fill="#bb9af7" opacity="0.4"/>
  <text x="517" y="400" text-anchor="middle" font-size="10" fill="#a9b1d6">v_2</text>

  <!-- v_3 thumbnail -->
  <rect x="560" y="330" width="55" height="55" rx="3" fill="#1a1b26" stroke="#bb9af7" stroke-width="1.5"/>
  <circle cx="587" cy="357" r="12" fill="none" stroke="#bb9af7" stroke-width="1.5" opacity="0.4"/>
  <circle cx="587" cy="357" r="5" fill="#bb9af7" opacity="0.3"/>
  <text x="587" y="400" text-anchor="middle" font-size="10" fill="#a9b1d6">v_3</text>

  <!-- ===== Rank-k formula ===== -->
  <rect x="150" y="425" width="500" height="55" rx="8" fill="#1a1b26" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0caf5">
    Rank-k approximation: T_k = sum_{i=1}^{k} sigma_i * u_i * v_i^T
  </text>
  <text x="400" y="468" text-anchor="middle" font-size="11" fill="#565f89">
    Minimizes ||T - T_k||_F (Eckart-Young-Mirsky theorem)
  </text>

  <!-- Connecting lines from bars to thumbnails -->
  <line x1="660" y1="232" x2="67" y2="328" stroke="#51cf66" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="695" y1="232" x2="137" y2="328" stroke="#51cf66" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="730" y1="232" x2="207" y2="328" stroke="#51cf66" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3"/>

  <line x1="660" y1="232" x2="447" y2="328" stroke="#bb9af7" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="695" y1="232" x2="517" y2="328" stroke="#bb9af7" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="730" y1="232" x2="587" y2="328" stroke="#bb9af7" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3"/>
</svg>
